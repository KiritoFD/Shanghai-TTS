<!doctype html>
<html lang="zh">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <link rel="stylesheet" href="/static/fonts/sliced/result.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <title>沪语词典</title>
        <style>
            /* ── 设计令牌 ─────────────────────────────────────────── */
            :root {
                --brand: #2563eb;
                --brand-dk: #1d4ed8;
                --brand-lt: #eff6ff;
                --surface: #ffffff;
                --bg: #f0f4f8;
                --border: #dde4ee;
                --text-pri: #1a1a1a;
                --text-sec: #64748b;
                --text-inv: #ffffff;
                --bubble-ai: #ffffff;
                --bubble-usr: var(--brand);
                --radius-lg: 18px;
                --radius-md: 12px;
                --radius-sm: 8px;
                --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.08);
                --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.1);
                --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.15);
                --font: "Noto Sans SC", "HanaMinB", sans-serif;
                --ease: cubic-bezier(0.4, 0, 0.2, 1);
            }

            /* ── Reset ───────────────────────────────────────────── */
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: var(--font);
                background: var(--bg);
                display: flex;
                flex-direction: column;
                height: 100dvh;
                overflow: hidden;
                color: var(--text-pri);
                -webkit-font-smoothing: antialiased;
            }

            /* ── 顶栏 ────────────────────────────────────────────── */
            .topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 14px 20px 12px;
                background: var(--surface);
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
                box-shadow: var(--shadow-sm);
                position: relative;
                z-index: 10;
            }

            .topbar-title {
                display: flex;
                flex-direction: column;
                gap: 1px;
            }

            .topbar-title h1 {
                font-size: 1.05rem;
                font-weight: 700;
                color: var(--brand);
                letter-spacing: 0.04em;
                line-height: 1.2;
            }

            .topbar-title span {
                font-size: 0.72rem;
                color: var(--text-sec);
                letter-spacing: 0.02em;
            }

            /* 右上角图标按钮组 */
            .topbar-actions {
                display: flex;
                gap: 4px;
            }

            .icon-btn {
                width: 36px;
                height: 36px;
                border: none;
                background: transparent;
                border-radius: 50%;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--text-sec);
                font-size: 1.1rem;
                transition:
                    background 0.15s var(--ease),
                    color 0.15s var(--ease);
                padding: 0;
                font-family: inherit;
                font-weight: normal;
            }

            .icon-btn:hover {
                background: var(--brand-lt);
                color: var(--brand);
            }
            .icon-btn:active {
                background: #dbeafe;
            }
            .icon-btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            /* ── 聊天区 ───────────────────────────────────────────── */
            #chat-window {
                flex: 1;
                overflow-y: auto;
                padding: 20px 16px;
                scroll-behavior: smooth;
                -webkit-overflow-scrolling: touch;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            /* 自定义滚动条 */
            #chat-window::-webkit-scrollbar {
                width: 4px;
            }
            #chat-window::-webkit-scrollbar-track {
                background: transparent;
            }
            #chat-window::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 2px;
            }

            /* ── 消息气泡 ─────────────────────────────────────────── */
            .msg-row {
                display: flex;
                align-items: flex-end;
                gap: 8px;
                max-width: 82%;
            }

            .msg-row.user {
                align-self: flex-end;
                flex-direction: row-reverse;
            }
            .msg-row.ai {
                align-self: flex-start;
            }

            .msg-content {
                display: flex;
                flex-direction: column;
                gap: 6px;
                min-width: 0;
            }

            /* 头像圆点 */
            .avatar {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 0.72rem;
                font-weight: 700;
                line-height: 1;
                user-select: none;
            }

            .avatar.ai-av {
                background: var(--brand-lt);
                color: var(--brand);
            }
            .avatar.usr-av {
                background: var(--brand-dk);
                color: #fff;
            }

            /* 气泡本体 */
            .bubble {
                padding: 10px 14px;
                border-radius: var(--radius-lg);
                line-height: 1.6;
                font-size: 0.93rem;
                word-break: break-word;
                box-shadow: var(--shadow-sm);
                position: relative;
            }

            .msg-row.ai .bubble {
                background: var(--bubble-ai);
                color: var(--text-pri);
                border-bottom-left-radius: 4px;
                border: 1px solid var(--border);
            }

            .msg-row.user .bubble {
                background: var(--bubble-usr);
                color: var(--text-inv);
                border-bottom-right-radius: 4px;
            }

            /* 链接 & 词条按钮（AI 气泡内） */
            .msg-row.ai .bubble a {
                color: var(--brand);
                text-decoration: none;
                font-weight: 500;
            }
            .msg-row.ai .bubble a:hover {
                text-decoration: underline;
            }

            .msg-row.ai .bubble hr {
                border: none;
                border-top: 1px solid var(--border);
                margin: 8px 0;
            }

            /* 音频控件 */
            .bubble audio {
                display: block;
                margin-top: 8px;
                width: 100%;
                min-width: min(260px, 100%);
                max-width: 420px;
                height: 36px;
                border-radius: var(--radius-sm);
                accent-color: var(--brand);
            }

            .msg-tools {
                display: flex;
                align-items: center;
                gap: 8px;
                color: var(--text-sec);
                font-size: 0.74rem;
                line-height: 1;
                padding: 0 4px;
            }

            .msg-row.user .msg-tools {
                justify-content: flex-end;
                color: var(--text-sec);
            }

            .msg-time {
                min-width: 0;
                white-space: nowrap;
            }

            .msg-action {
                border: 1px solid var(--border);
                background: var(--surface);
                color: var(--text-sec);
                border-radius: 999px;
                padding: 4px 8px;
                font: inherit;
                font-size: 0.74rem;
                line-height: 1;
                cursor: pointer;
                transition:
                    border-color 0.15s var(--ease),
                    color 0.15s var(--ease),
                    background 0.15s var(--ease);
            }

            .msg-action:hover {
                background: var(--brand-lt);
                border-color: #bfdbfe;
                color: var(--brand);
            }

            /* 打字动画 */
            .thinking {
                color: var(--text-sec);
                font-style: italic;
                font-size: 0.88rem;
            }

            @keyframes dot-pulse {
                0%,
                80%,
                100% {
                    opacity: 0.25;
                }
                40% {
                    opacity: 1;
                }
            }

            .thinking::after {
                content: "";
                display: inline-block;
                width: 18px;
                background: repeating-linear-gradient(
                    90deg,
                    var(--text-sec) 0,
                    var(--text-sec) 4px,
                    transparent 4px,
                    transparent 8px
                );
                height: 3px;
                border-radius: 2px;
                vertical-align: middle;
                margin-left: 4px;
                animation: dot-pulse 1.4s infinite both;
            }

            /* ── 输入栏 ───────────────────────────────────────────── */
            .input-area {
                flex-shrink: 0;
                padding: 12px 16px;
                padding-bottom: calc(env(safe-area-inset-bottom) + 12px);
                background: var(--surface);
                border-top: 1px solid var(--border);
            }

            .input-row {
                display: flex;
                gap: 8px;
                align-items: center;
                background: var(--bg);
                border: 1.5px solid var(--border);
                border-radius: 30px;
                padding: 4px 4px 4px 16px;
                transition:
                    border-color 0.2s var(--ease),
                    box-shadow 0.2s var(--ease);
            }

            .input-row:focus-within {
                border-color: var(--brand);
                box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            }

            #userInput {
                flex: 1;
                border: none;
                background: transparent;
                outline: none;
                font-family: var(--font);
                font-size: 0.95rem;
                color: var(--text-pri);
                padding: 6px 0;
                min-width: 0;
            }

            #userInput::placeholder {
                color: #b0a89e;
            }

            #sendBtn {
                flex-shrink: 0;
                width: 38px;
                height: 38px;
                border: none;
                border-radius: 50%;
                background: var(--brand);
                color: #fff;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1rem;
                transition:
                    background 0.15s var(--ease),
                    transform 0.1s var(--ease);
                padding: 0;
            }

            #sendBtn:hover {
                background: var(--brand-dk);
            }
            #sendBtn:active {
                transform: scale(0.92);
            }
            #sendBtn:disabled {
                background: #ccc;
                cursor: not-allowed;
                transform: none;
            }

            /* ── 重建弹窗 ─────────────────────────────────────────── */
            #rebuild-modal {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(26, 26, 26, 0.5);
                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(4px);
                z-index: 200;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            #rebuild-modal.show {
                display: flex;
            }

            #rebuild-box {
                background: var(--surface);
                border-radius: var(--radius-md);
                width: min(480px, 100%);
                max-height: 70vh;
                display: flex;
                flex-direction: column;
                box-shadow: var(--shadow-lg);
                overflow: hidden;
            }

            .rebuild-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 16px 20px;
                border-bottom: 1px solid var(--border);
            }

            .rebuild-header h3 {
                font-size: 0.95rem;
                font-weight: 600;
                color: var(--text-pri);
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .rebuild-header h3::before {
                content: "";
                display: inline-block;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--brand);
                flex-shrink: 0;
            }

            #rebuild-close-x {
                width: 28px;
                height: 28px;
                border: none;
                background: transparent;
                cursor: pointer;
                border-radius: 50%;
                color: var(--text-sec);
                font-size: 1rem;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: background 0.15s;
                padding: 0;
                line-height: 1;
            }

            #rebuild-close-x:hover {
                background: var(--brand-lt);
                color: var(--brand);
            }

            #rebuild-log {
                flex: 1;
                overflow-y: auto;
                font-size: 0.78rem;
                font-family: "Menlo", "Consolas", monospace;
                background: #fafaf8;
                padding: 14px 16px;
                min-height: 140px;
                max-height: 320px;
                white-space: pre-wrap;
                word-break: break-all;
                color: #3a3530;
                line-height: 1.7;
            }

            .rebuild-footer {
                padding: 12px 20px;
                border-top: 1px solid var(--border);
                display: flex;
                justify-content: flex-end;
            }

            .rebuild-footer button {
                padding: 7px 20px;
                border: 1.5px solid var(--brand);
                background: transparent;
                color: var(--brand);
                border-radius: 20px;
                font-family: var(--font);
                font-size: 0.85rem;
                font-weight: 500;
                cursor: pointer;
                transition:
                    background 0.15s,
                    color 0.15s;
            }

            .rebuild-footer button:hover {
                background: var(--brand);
                color: #fff;
            }

            /* ── 响应式 ───────────────────────────────────────────── */
            @media (max-width: 480px) {
                .msg-row {
                    max-width: 90%;
                }
                .avatar {
                    display: none;
                }
                #chat-window {
                    padding: 14px 12px;
                    gap: 10px;
                }
                .topbar {
                    padding: 12px 16px 10px;
                }
            }
        </style>
    </head>
    <body>
        <!-- 顶栏 -->
        <header class="topbar">
            <div class="topbar-title">
                <h1>侬好，今朝想学啥上海闲话？</h1>
            </div>
            <div class="topbar-actions">
                <button
                    class="icon-btn"
                    id="rebuild-btn"
                    onclick="startRebuild()"
                    title="刷新词典索引"
                    disabled
                >
                    ↻
                </button>
            </div>
        </header>

        <!-- 聊天区 -->
        <div id="chat-window">
            <div class="msg-row ai">
                <div class="avatar ai-av">沪</div>
                <div class="bubble">
                    侬好。侬可以问我“自行车怎么说”，也可以直接点候选词条生成语音。
                </div>
            </div>
        </div>

        <!-- 输入栏 -->
        <div class="input-area">
            <div class="input-row">
                <input
                    type="text"
                    id="userInput"
                    placeholder="输入查询内容…"
                    onkeypress="if (event.keyCode === 13) sendMessage();"
                    autocomplete="off"
                />
                <button id="sendBtn" onclick="sendMessage()" title="发送">
                    <svg
                        width="16"
                        height="16"
                        viewBox="0 0 16 16"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            d="M14 8L2 2l2.5 6L2 14l12-6z"
                            fill="currentColor"
                        />
                    </svg>
                </button>
            </div>
        </div>

        <!-- 重建弹窗 -->
        <div id="rebuild-modal">
            <div id="rebuild-box">
                <div class="rebuild-header">
                    <h3>词典索引重建</h3>
                    <button
                        id="rebuild-close-x"
                        onclick="closeRebuildModal()"
                        title="关闭"
                    >
                        ✕
                    </button>
                </div>
                <div id="rebuild-log">等待中…</div>
                <div class="rebuild-footer">
                    <button onclick="closeRebuildModal()">关闭</button>
                </div>
            </div>
        </div>

        <script>
            // 页面加载后启用刷新按钮（简单延迟，避免服务未就绪）
            setTimeout(() => {
                document.getElementById("rebuild-btn").disabled = false;
            }, 1000);

            /* ── 朗读词条快捷调用 ────────────────────────────────── */
            function quickRead(word) {
                submitMessage(`【${word}】`, `▶ 朗读【${word}】`);
            }

            /* ── 发送消息 ────────────────────────────────────────── */
            async function submitMessage(rawText, displayText = rawText) {
                const sendBtn = document.getElementById("sendBtn");
                const text = rawText.trim();
                if (!text) return;

                const userMsg = appendMsg("user", displayText, { html: false });
                setUserMessageActions(userMsg.row, text);
                sendBtn.disabled = true;

                const tempId = "msg-" + Date.now();
                const startedAt = performance.now();
                const aiMsg = appendMsg(
                    "ai",
                    `<span id="${tempId}" class="thinking">正在处理中</span>`,
                    { elapsedMs: 0 },
                );
                const timerId = setInterval(() => {
                    updateMessageTime(aiMsg.row, startedAt, true);
                }, 100);

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);

                try {
                    const res = await fetch("/api/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text }),
                        signal: controller.signal,
                    });
                    clearTimeout(timeoutId);
                    const data = await res.json();
                    const el = document.getElementById(tempId);
                    if (el) {
                        let html = data.text || "";
                        if (data.audio) {
                            const url = data.audio + "?v=" + Math.random();
                            html += buildAudioHtml(url);
                        }
                        el.parentElement.innerHTML = html;
                        const audio = el.parentElement.querySelector("audio");
                        if (audio) {
                            audio.load();
                            audio.play().catch(() => {});
                        }
                        setMessageActions(aiMsg.row, text, displayText);
                    }
                } catch (e) {
                    clearTimeout(timeoutId);
                    const el = document.getElementById(tempId);
                    if (el) {
                        el.parentElement.innerHTML = `<span style="color:#dc2626;font-size:.85rem">${
                            e.name === "AbortError"
                                ? "请求超时，请稍后再试。"
                                : "请求失败，请稍后再试。"
                        }</span>`;
                        setMessageActions(aiMsg.row, text, displayText);
                    }
                } finally {
                    clearInterval(timerId);
                    updateMessageTime(aiMsg.row, startedAt, false);
                    sendBtn.disabled = false;
                    scrollToBottom();
                }
            }

            async function sendMessage() {
                const input = document.getElementById("userInput");
                const text = input.value.trim();
                if (!text) return;
                input.value = "";
                await submitMessage(text);
            }

            /* ── 追加消息行 ──────────────────────────────────────── */
            function appendMsg(type, content, options = {}) {
                const win = document.getElementById("chat-window");
                const row = document.createElement("div");
                row.className = "msg-row " + type;

                const avatarLabel = type === "ai" ? "沪" : "我";
                const avatarClass = type === "ai" ? "ai-av" : "usr-av";

                const avatar = document.createElement("div");
                avatar.className = `avatar ${avatarClass}`;
                avatar.textContent = avatarLabel;

                const contentWrap = document.createElement("div");
                contentWrap.className = "msg-content";

                const bubble = document.createElement("div");
                bubble.className = "bubble";
                if (options.html === false) {
                    bubble.textContent = content;
                } else {
                    bubble.innerHTML = content;
                }
                contentWrap.appendChild(bubble);

                if (type === "ai" || type === "user" || options.elapsedMs !== undefined) {
                    const tools = document.createElement("div");
                    tools.className = "msg-tools";
                    if (type === "ai" || options.elapsedMs !== undefined) {
                        tools.innerHTML = `<span class="msg-time">${formatElapsed(options.elapsedMs || 0)}</span>`;
                    }
                    contentWrap.appendChild(tools);
                }

                row.appendChild(avatar);
                row.appendChild(contentWrap);
                win.appendChild(row);
                scrollToBottom();
                return { row, bubble };
            }

            function formatElapsed(ms) {
                return `用时 ${(ms / 1000).toFixed(1)}s`;
            }

            function updateMessageTime(row, startedAt, running) {
                const time = row.querySelector(".msg-time");
                if (!time) return;
                const elapsed = performance.now() - startedAt;
                time.textContent = running
                    ? `回复中 ${(elapsed / 1000).toFixed(1)}s`
                    : formatElapsed(elapsed);
            }

            function setMessageActions(row, rawText, displayText) {
                const tools = row.querySelector(".msg-tools");
                if (!tools || tools.dataset.ready === "1") return;
                tools.dataset.ready = "1";

                const copyBtn = document.createElement("button");
                copyBtn.className = "msg-action";
                copyBtn.type = "button";
                copyBtn.textContent = "复制";
                copyBtn.title = "复制回复";
                copyBtn.addEventListener("click", async () => {
                    const bubble = row.querySelector(".bubble");
                    const text = bubble ? bubble.innerText.trim() : "";
                    await copyText(text);
                    copyBtn.textContent = "已复制";
                    setTimeout(() => {
                        copyBtn.textContent = "复制";
                    }, 1200);
                });

                const retryBtn = document.createElement("button");
                retryBtn.className = "msg-action";
                retryBtn.type = "button";
                retryBtn.textContent = "重试";
                retryBtn.title = "重新生成这条回复";
                retryBtn.addEventListener("click", () => {
                    submitMessage(rawText, displayText);
                });

                tools.appendChild(copyBtn);
                tools.appendChild(retryBtn);
            }

            function setUserMessageActions(row, text) {
                const tools = row.querySelector(".msg-tools");
                if (!tools || tools.dataset.ready === "1") return;
                tools.dataset.ready = "1";

                const copyBtn = document.createElement("button");
                copyBtn.className = "msg-action";
                copyBtn.type = "button";
                copyBtn.textContent = "复制";
                copyBtn.title = "复制这条输入";
                copyBtn.addEventListener("click", async () => {
                    await copyText(text);
                    copyBtn.textContent = "已复制";
                    setTimeout(() => {
                        copyBtn.textContent = "复制";
                    }, 1200);
                });
                tools.appendChild(copyBtn);
            }

            function buildAudioHtml(url) {
                return `<audio controls autoplay preload="metadata" src="${url}"></audio>`;
            }

            async function copyText(text) {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return;
                }
                const textarea = document.createElement("textarea");
                textarea.value = text;
                textarea.style.position = "fixed";
                textarea.style.opacity = "0";
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                document.execCommand("copy");
                textarea.remove();
            }

            function scrollToBottom() {
                const win = document.getElementById("chat-window");
                win.scrollTop = win.scrollHeight;
                setTimeout(() => {
                    win.scrollTop = win.scrollHeight;
                }, 80);
            }

            /* ── 词典索引重建 ────────────────────────────────────── */
            let _rebuildTimer = null;

            function startRebuild() {
                const btn = document.getElementById("rebuild-btn");
                const log = document.getElementById("rebuild-log");
                btn.disabled = true;
                log.textContent = "正在发起重建请求…";
                document.getElementById("rebuild-modal").classList.add("show");

                fetch("/api/rebuild_index", { method: "POST" })
                    .then((r) => r.json())
                    .then((data) => {
                        if (!data.ok && data.error === "already_running") {
                            log.textContent = "已有重建任务在运行，轮询进度…";
                        } else if (!data.ok) {
                            log.textContent =
                                "启动失败：" +
                                (data.error || JSON.stringify(data));
                            btn.disabled = false;
                            return;
                        }
                        pollRebuild();
                    })
                    .catch((e) => {
                        log.textContent = "请求失败：" + e;
                        btn.disabled = false;
                    });
            }

            function pollRebuild() {
                if (_rebuildTimer) clearTimeout(_rebuildTimer);
                fetch("/api/rebuild_index/status")
                    .then((r) => r.json())
                    .then((data) => {
                        const s = data.status || {};
                        const log = document.getElementById("rebuild-log");
                        log.textContent = (s.progress || []).join("\n");
                        log.scrollTop = log.scrollHeight;

                        if (s.error) {
                            log.textContent += "\n[错误] " + s.error;
                            document.getElementById("rebuild-btn").disabled =
                                false;
                            return;
                        }
                        if (s.done) {
                            log.textContent +=
                                "\n✅ 索引重建完成，新词条已可查询。";
                            document.getElementById("rebuild-btn").disabled =
                                false;
                            return;
                        }
                        _rebuildTimer = setTimeout(pollRebuild, 2000);
                    })
                    .catch(() => {
                        _rebuildTimer = setTimeout(pollRebuild, 3000);
                    });
            }

            function closeRebuildModal() {
                document
                    .getElementById("rebuild-modal")
                    .classList.remove("show");
                if (_rebuildTimer) {
                    clearTimeout(_rebuildTimer);
                    _rebuildTimer = null;
                }
            }
        </script>
    </body>
</html>
