<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        :root {
            --primary-color: #0051ff;
            --text-color: #333;
            --bg-color: #f4f7f9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 8rem;
            margin: 0;
            color: var(--primary-color);
            line-height: 1;
        }

        h2 {
            font-size: 1.5rem;
            margin: 20px 0;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #003dbb;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .footer a {
            color: var(--primary-color);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>抱歉，页面消失了</h2>
        <p>您访问的页面可能已被移动、删除，或者地址输入有误。</p>
        
        <a href="/" class="btn">返回首页</a>
